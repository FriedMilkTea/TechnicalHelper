<head>

<style>
:root{--bg:#fff;--fg:#3c3c3c;--mute:#777;--line:#e5e5e5;--green:#58cc02;--gd:#58a700;--blue:#1cb0f6;--bd:#1899d6;--red:#ff4b4b;--rd:#ea2b2b;--gbg:#d7ffb8;--rbg:#ffdfe0;--sel:#ddf4ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#e5eef2;--mute:#8da0a8;--line:#37464f;--gbg:#1f3a12;--rbg:#40191b;--sel:#16384a}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#e5eef2;--mute:#8da0a8;--line:#37464f;--gbg:#1f3a12;--rbg:#40191b;--sel:#16384a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif;font-weight:600}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 20px 0}
.top{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s}
.hearts{font-weight:900;color:var(--red);min-width:44px;text-align:right}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.tag{align-self:flex-start;font-weight:800;color:var(--blue);margin-bottom:8px}
h1{font-size:28px;font-weight:900;margin:0 0 20px;line-height:1.25}
.code{display:inline-block;background:var(--sel);color:var(--bd);border-radius:12px;padding:2px 12px;font-weight:900}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-weight:800;font-size:17px;text-align:left;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 18px;cursor:pointer}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt.sel{background:var(--sel);border-color:var(--blue)}
.opt.ok{background:var(--gbg);border-color:var(--green)}
.opt.no{background:var(--rbg);border-color:var(--red)}
.opt:active{transform:translateY(2px);border-bottom-width:3px}
.foot{margin:0 -20px;padding:18px 20px 22px;border-top:2px solid var(--line)}
.foot.ok{background:var(--gbg);border-color:transparent}.foot.no{background:var(--rbg);border-color:transparent}
.fb{font-weight:900;font-size:21px;margin-bottom:4px}
.foot.ok .fb{color:var(--gd)}.foot.no .fb{color:var(--rd)}
.ex{margin:0 0 14px;font-weight:600}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:17px;color:#fff;background:var(--green);border:0;border-bottom:5px solid var(--gd);border-radius:16px;padding:14px;cursor:pointer}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mute);cursor:default}
.foot.no .btn{background:var(--red);border-bottom-color:var(--rd)}
.btn.blue{background:var(--blue);border-bottom-color:var(--bd)}
.end{text-align:center}
.end .big{font-size:64px;font-weight:900;color:var(--green);line-height:1}
.end p{color:var(--mute);margin:8px 0 22px}
.row{display:grid;gap:12px;max-width:340px;margin:0 auto}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}

.x{font:inherit;font-size:22px;font-weight:900;color:var(--mute);background:none;border:0;cursor:pointer;padding:4px 6px}
.menu{justify-content:flex-start}
.menu h1{margin-bottom:6px}.sub{margin:0;color:var(--mute)}
.menu h2{font-size:16px;font-weight:800;color:var(--mute);margin:24px 0 10px}
.mode b{display:block;font-size:18px;font-weight:900}.mode span{display:block;font-weight:600;color:var(--mute);margin-top:2px}.mode small{display:block;font-weight:800;color:var(--gd);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:800;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:99px;padding:8px 16px;cursor:pointer}
.chip.sel{background:var(--sel);border-color:var(--blue);color:var(--bd)}
.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.foot.stick{position:sticky;bottom:0;background:var(--bg)}
.btn.ghost{background:none;color:var(--bd);border:2px solid var(--line);border-bottom-width:5px}
.cv{background:var(--sel);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:16px;font-weight:700;line-height:1.55}
</style>
</head>

["Role applied for: Backend Developer / CV: every project is a Swift mobile app||What is the best next step?","","Ask about backend exposure and interest","Progress them to the manager|Reject them straight away|Ask them to rewrite the CV","The CV doesn't match the role, but a short call may clarify."],
["Responsibilities: attended meetings, wrote code, fixed bugs||What is missing from this CV?","","Specific achievements and measurable impact","A list of all the meetings|The employer's address|A longer skills list","Duties describe the job. Achievements describe the person."],
["Cloud Engineer, 8 years / AWS, GCP, Azure / Led a migration of 200 servers||What is a good probing question?","","What went wrong during the migration?","Which cloud logo do you prefer?|How many cloud providers exist?|When did the migration start?","Real project owners remember the problems."],
["Team Lead, 10 engineers / No hands-on coding mentioned in the last 4 years||For a hands-on senior engineer role, what is the concern?","","They may have moved away from hands-on coding","They may be too junior|They may lack leadership|They may dislike teams","Check how much they still code before progressing."],
["Contract Engineer, 2020-2024 / Four 6-month contracts / Each ended on schedule||How should this pattern be read?","","Normal contracting, not a performance concern","A clear sign of poor performance|Evidence of lying on the CV|A reason to avoid all contractors","Fixed-term contracts end on schedule by design."]
];
const T=[..."DFCOMMDODO"+"FCCBBDMBCO"+"DFCDMCODOF"+"FBBBCCDDCC"+"DDDMMDDBDO"+"OCCBRJJJJJ"+"JJRRRRRRRR"+"SSSSSS"+"QQQQQQ"+"AAAAAA"+"GGGGGG"+"FFF"+"BBB"+"CCC"+"DDD"+"MM"+"OO"+"RRRR"+"FFFFFF"+"BBBBBB"+"CCCCCC"+"DDDDDD"+"MMMMMM"+"OOOOOO"+"QQQ"+"GGG"+"SSS"+"QQQQQQQGGGGGGGSSSSSSSAAAAAFFFBBBCCCDDDMMOOJJJJ"+"XXXXXXXXXXXXXXXX"+"JJJJJJJJJJJJJJJXXXXXXXXXXXXXXXRRRRRRRRRRRRRRR"+"VVVVVVVVVVVVVVVVVVVV"];
T[20]="G";T[40]="G";
if(T.length!==Q.length)console.warn("topic map mismatch",T.length,Q.length);
Q.forEach((q,i)=>{q.t=T[i];q.id=i;q.gen=!q[0].includes("?")||(i>=20&&i<=29)});
// Balance option lengths so the right answer isn't the longest
const FIX={190:"Compressing large JSON payloads|Scheduling recurring background jobs|Styling API error responses for users",169:"Fine-tuning the model weights|Quantisation of the model|Pruning unused layers",206:"Reject, the language is wrong|Reject, the seniority doesn't match|Redirect them to frontend roles instead",182:"Encrypts every request in transit|Deletes old data automatically|Splits databases across regions",74:"Database replication between regions|CSS theming for dark mode|Container scheduling on clusters",124:"A database driver for connections|A UI component library for pages|A cloud billing tool for accounts",181:"Styling web pages across browsers|Encrypting traffic between servers|Storing images in object storage",220:"Which colour should a 404 page use?|How many APIs have you personally seen?|Do you enjoy working with APIs?",208:"No relevant experience at all|A completely different skill set|Only suited to NoSQL roles",218:"Reject the application immediately|Assume they performed poorly|Ignore the dates completely",86:"Compiles code into smaller bundles|Stores user passwords securely|Schedules background jobs nightly",82:"A tiny database for small apps|A mobile OS feature for services|A CSS layout for small screens",178:"Faster downloads on slow networks|Antivirus scanning for files|Automatic backups of devices",175:"To make logins noticeably faster|To compress stored password data|To let admins read passwords",142:"A background update of the app|A pull-down refresh gesture|An in-app popup message",193:"Testing the same site on two browsers|Deploying new code twice a day|Using two cloud providers at once",166:"A computer network built for GPUs|A database designed for images|A type of search index",173:"A database backup technique for web apps|A CSS framework for layout|A type of network firewall",130:"A running container instance|A virtual machine disk file|A Kubernetes cluster node",125:"It never returns any errors|It has no database behind it|It only serves static files",111:"They are exactly the same job|The manager writes all the code|The tech lead handles payroll",112:"Hire immediately for the breadth|Reject automatically as unrealistic|Ignore the CV and use a test",210:"Python listed in a skills section|Python mentioned in their headline|A certificate with no projects",217:"It decides their salary band|It decides the office layout|It makes no difference at all",131:"Writing application code in the cloud|Hardware that writes its own code|Documenting servers in a company wiki",115:"The browser's network cache store|A CSS preprocessor for styles|The server's file system layout",158:"A longer minimum password length|Automatic password resets each month|Encrypted email for all accounts",189:"Slowing down every database query|Compressing API responses|Hiding API errors from clients"};
Object.entries(FIX).forEach(([i,w])=>Q[i][3]=w);
[[52,"Cloud","Frontend|Databases|Mobile"],[71,"Security & monitoring","Frontend styling|Mobile UI|Game physics"]].forEach(([i,a,w])=>{Q[i][2]=a;Q[i][3]=w});
Q.forEach(q=>{if(!q[0].includes("?"))q[2]=q[2].replace(/\s*\(.*\)$/,"")});
const TOP={J:"Match the role",X:"Screening scenarios",V:"CV screening",R:"Recruiter basics",F:"Frontend",B:"Backend",C:"DevOps & Cloud",D:"Data & Databases",M:"Mobile",S:"Security",Q:"QA & Testing",G:"AI & ML",A:"Architecture & Concepts",O:"Systems & Games"};
const MODES=[["classic","Classic","10 questions, 3 hearts"],["practice","Practice","10 questions, no hearts. Take your time with each explanation"]];
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const best=(m,v)=>{try{const k="cq-best-"+m;if(v!==undefined)localStorage.setItem(k,v);return +localStorage.getItem(k)||0}catch(e){return 0}};
let M={mode:"classic",topics:new Set()},S,weak=new Set;
try{weak=new Set(JSON.parse(localStorage.getItem("cq-weak")||"[]"))}catch(e){}
const saveWeak=()=>{try{localStorage.setItem("cq-weak",JSON.stringify([...weak]))}catch(e){}};
const pool=()=>M.mode=="review"?Q.filter(q=>weak.has(q.id)):Q.filter(q=>!M.topics.size||(M.topics.has(q.t)&&!q.gen));
const FOC="JXRV";
const cvp=t=>{const x=t.split("||");return x.length>1?`<div class="cv">${x[0].split(" / ").join("<br>")}</div>${x[1]}`:t};
const pick=(p,n,skip)=>{if(skip)return shuf(p).slice(0,n);const f=shuf(p.filter(q=>FOC.includes(q.t))),r=shuf(p.filter(q=>!FOC.includes(q.t))),a=f.slice(0,6),b=r.slice(0,n-a.length);return shuf([...a,...b,...f.slice(6,6+n-a.length-b.length)])};
const mk=q=>{const lang=!q[0].includes("?"),W=Array.isArray(q[3])?q[3]:q[3].split("|");return{p:lang?`What is <span class="code">${q[0]}</span> mainly used for?`:cvp(q[0]),raw:q,id:q.id,tag:q.gen?"General":TOP[q.t],a:q[2],e:q[4],o:shuf([q[2],...shuf(W).slice(0,3)])}};

function menu(){
  if(M.mode=="review"&&!weak.size)M.mode="classic";const c=pool().length;
  app.innerHTML=`<main class="menu"><h1>Technical Helper</h1><p class="sub">Practice role matching, screening and tech basics for technical recruiting.</p>
  <h2>Game type</h2><div class="opts">${[...MODES,...(weak.size?[["review","Weak spots","Replay the "+weak.size+" question"+(weak.size>1?"s":"")+" you missed. Get one right to clear it"]]:[])].map(([k,n,d])=>`<button class="opt mode${M.mode==k?" sel":""}" data-m="${k}"><b>${n}</b><span>${d}</span>${k=="classic"&&best(k)?`<small>Best: ${best(k)}</small>`:""}</button>`).join("")}</div>
  <h2>Topics</h2><p class="sub" style="margin:-4px 0 12px">Topic rounds skip "what is it used for?" questions, since the topic already gives the answer away. Choose All topics for those. All-topics rounds focus on role matching and screening.</p><div class="chips"><button class="chip${M.topics.size?"":" sel"}" data-t="*">All topics (${Q.length})</button>${Object.entries(TOP).map(([k,v])=>`<button class="chip${M.topics.has(k)?" sel":""}" data-t="${k}">${v} (${Q.filter(q=>q.t==k&&!q.gen).length})</button>`).join("")}</div></main>
  <div class="foot stick"><button class="btn" id="go">Start (${c} questions available)</button></div>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{M.mode=b.dataset.m;menu()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t=="*")M.topics.clear();else M.topics.has(t)?M.topics.delete(t):M.topics.add(t);menu()});
  $("#go").onclick=start;
}
function start(list){
  const rev=Array.isArray(list),p=rev?list:pool(),n=Math.min(10,p.length),mode=rev?"review":M.mode;
  S={mode,q:pick(p,n,rev||M.topics.size||M.mode=="review"),i:0,score:0,hearts:mode=="classic"?3:0,total:n,missed:[]};show();
}
function show(){
  const c=S.cur=mk(S.q.shift());S.done=false;S.sel=null;
  app.innerHTML=`<div class="top"><button class="x" id="x" aria-label="Quit to menu">✕</button><div class="bar"><i style="width:${S.i/S.total*100}%"></i></div><div class="hearts" id="stat">${S.mode=="classic"?"❤ "+S.hearts:""}</div></div>
  <main><div class="tag">${c.tag}</div><h1>${c.p}</h1><div class="opts">${c.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div></main>
  <div class="foot" id="foot"><button class="btn" id="go" disabled>Check</button></div>`;
  $("#x").onclick=menu;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(S.done)return;S.sel=+b.dataset.i;
    document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));$("#go").disabled=false});
  $("#go").onclick=()=>grade(S.sel);
}
function grade(i){
  const c=S.cur,ok=c.o[i]===c.a,lives=S.mode=="classic";S.done=true;S.i++;
  if(ok){S.score++;weak.delete(c.id)}else{weak.add(c.id);S.missed.push(c.raw);if(lives)S.hearts--}saveWeak();
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");if(c.o[k]===c.a)b.classList.add("ok");else if(k===i)b.classList.add("no")});
  if(lives)$("#stat").textContent="❤ "+S.hearts;
  const fin=(lives&&S.hearts<=0)||S.i>=S.total,f=$("#foot");
  f.className="foot "+(ok?"ok":"no");if(!ok)f.classList.add("shake");
  f.innerHTML=`<div class="fb">${ok?"Correct!":"Not quite"}</div><p class="ex">${ok?"":`Answer: ${c.a}. `}${c.e}</p><button class="btn" id="go">${fin?"See results":"Continue"}</button>`;
  $("#go").onclick=()=>fin?end():show();$("#go").focus();
}
function end(){
  const m=S.mode,b=m=="classic"?Math.max(best(m),S.score):0;if(m=="classic")best(m,b);
  const title=m=="practice"?"Practice complete":m=="review"?"Review complete":S.hearts<=0?"Out of hearts":S.score==S.total?"Flawless run!":"Round complete!";
  app.innerHTML=`<div class="top"><div class="bar"><i style="width:100%"></i></div></div>
  <main class="end"><div class="big">${S.score}/${S.total}</div><h1 style="margin-top:12px">${title}</h1><p>${m=="classic"?"Best score: "+b:"Practice rounds don't count toward best scores."}${weak.size?" Weak spots saved: "+weak.size+".":""}</p>
  <div class="row">${S.missed.length?`<button class="btn" id="rev">Review missed (${S.missed.length})</button>`:""}<button class="btn blue" id="again">Play again</button><button class="btn ghost" id="menu">Change game or topics</button></div></main>`;
  $("#again").onclick=()=>start();$("#menu").onclick=menu;if(S.missed.length)$("#rev").onclick=()=>start(S.missed);
}
menu();
</script>
</body>
</html>
